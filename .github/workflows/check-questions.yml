name: Check assignment questions

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check question list
        id: check
        run: python monitor.py
      - name: Commit updated baseline
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add questions.json
          git commit -m "Update assignment question baseline"
          git push
      - name: Email when questions change
        if: steps.check.outputs.changed == 'true'
        # if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "New question detected: ${{ steps.check.outputs.title }}"
          to: ${{ vars.ALERT_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            A question list change was detected for ${{ steps.check.outputs.title }}.
            Added questions: ${{ steps.check.outputs.added }}
            Removed questions: ${{ steps.check.outputs.removed }}
            Assignment: https://exam.sanand.workers.dev/tds-2026-09-ga5

